<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" role="img" aria-label="Test pyramid: unit, integration, contract, acceptance, end to end">
  <style>
    .t{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .lbl{font-size:14px;font-weight:600;fill:#fff}
    .lbl-sm{font-size:11.5px;font-weight:600;fill:#fff}
    .note{font-size:13px;fill:#5a6474}
    .cap{font-size:12px;fill:#8892a0;font-style:italic}
    .band{stroke:#fff;stroke-width:2}
  </style>
  <g class="t">
    <polygon class="band" points="300,30 352,96 248,96" fill="#312e81"/>
    <polygon class="band" points="248,98 352,98 378,164 222,164" fill="#4338ca"/>
    <polygon class="band" points="222,166 378,166 404,232 196,232" fill="#4f46e5"/>
    <polygon class="band" points="196,234 404,234 430,300 170,300" fill="#818cf8"/>
    <polygon class="band" points="170,302 430,302 456,368 144,368" fill="#a5b4fc"/>
    <text class="lbl-sm" x="300" y="82" text-anchor="middle">E2E / UI</text>
    <text class="lbl-sm" x="300" y="140" text-anchor="middle">Acceptance / BDD</text>
    <text class="lbl" x="300" y="206" text-anchor="middle">Contract</text>
    <text class="lbl" x="300" y="272" text-anchor="middle">Integration</text>
    <text class="lbl" x="300" y="342" text-anchor="middle" fill="#1e1b4b">Unit</text>
    <line x1="470" y1="76" x2="358" y2="76" stroke="#dde3ea" stroke-width="1"/>
    <line x1="470" y1="140" x2="384" y2="140" stroke="#dde3ea" stroke-width="1"/>
    <line x1="470" y1="206" x2="410" y2="206" stroke="#dde3ea" stroke-width="1"/>
    <line x1="470" y1="272" x2="436" y2="272" stroke="#dde3ea" stroke-width="1"/>
    <line x1="470" y1="342" x2="462" y2="342" stroke="#dde3ea" stroke-width="1"/>
    <text class="note" x="482" y="81">a handful — critical journeys</text>
    <text class="note" x="482" y="145">the behaviours that matter</text>
    <text class="note" x="482" y="211">one per integration seam</text>
    <text class="note" x="482" y="277">real infrastructure</text>
    <text class="note" x="482" y="347">the bulk — fast, isolated</text>
    <line x1="104" y1="40" x2="104" y2="356" stroke="#e0e4f0" stroke-width="1.5"/>
    <polygon points="104,366 100,354 108,354" fill="#e0e4f0"/>
    <text class="cap" x="94" y="116" text-anchor="end">slower</text>
    <text class="cap" x="94" y="134" text-anchor="end">more brittle</text>
    <text class="cap" x="94" y="288" text-anchor="end">faster</text>
    <text class="cap" x="94" y="306" text-anchor="end">more reliable</text>
  </g>
</svg>
