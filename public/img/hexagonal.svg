<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Hexagonal architecture: domain core, ports, infrastructure adapters, bootstrap">
  <style>
    .t{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    .h1{font-size:17px;font-weight:700;fill:#fff}
    .h2{font-size:13px;font-weight:600;fill:#312e81}
    .sm{font-size:11.5px;fill:#5a6474}
    .port{font-size:10.5px;fill:#312e81;font-weight:600}
    .cap{font-size:12px;fill:#8892a0}
  </style>
  <g class="t">
    <rect x="40" y="26" width="560" height="388" rx="10" fill="none" stroke="#e0e4f0" stroke-width="1.5" stroke-dasharray="6 5"/>
    <text class="cap" x="56" y="48">bootstrap — wiring, configuration, entry point</text>
    <polygon points="320,86 452,162 452,314 320,390 188,314 188,162" fill="#f7f8fc" stroke="#a5b4fc" stroke-width="2"/>
    <text class="h2" x="320" y="118" text-anchor="middle">infrastructure — adapters</text>
    <polygon points="320,146 412,199 412,305 320,358 228,305 228,199" fill="#312e81"/>
    <text class="h1" x="320" y="245" text-anchor="middle">DOMAIN</text>
    <text class="sm" x="320" y="268" text-anchor="middle" fill="#c7d2fe">rules · entities · events</text>
    <text class="sm" x="320" y="286" text-anchor="middle" fill="#c7d2fe">no framework</text>
    <circle cx="320" cy="146" r="6" fill="#fff" stroke="#312e81" stroke-width="2.5"/>
    <circle cx="412" cy="199" r="6" fill="#fff" stroke="#312e81" stroke-width="2.5"/>
    <circle cx="412" cy="305" r="6" fill="#fff" stroke="#312e81" stroke-width="2.5"/>
    <circle cx="320" cy="358" r="6" fill="#fff" stroke="#312e81" stroke-width="2.5"/>
    <circle cx="228" cy="305" r="6" fill="#fff" stroke="#312e81" stroke-width="2.5"/>
    <circle cx="228" cy="199" r="6" fill="#fff" stroke="#312e81" stroke-width="2.5"/>
    <text class="port" x="320" y="136" text-anchor="middle">port</text>
    <text class="sm" x="474" y="180">REST controllers</text>
    <text class="sm" x="474" y="204">Kafka consumers</text>
    <text class="sm" x="474" y="300">JPA repositories</text>
    <text class="sm" x="474" y="324">API clients</text>
    <text class="sm" x="166" y="180" text-anchor="end">scheduler</text>
    <text class="sm" x="166" y="204" text-anchor="end">CLI</text>
    <text class="sm" x="166" y="300" text-anchor="end">file store</text>
    <text class="sm" x="166" y="324" text-anchor="end">cache</text>
    <path d="M470 190 L424 197" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M470 306 L424 304" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M170 190 L216 197" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#a)"/>
    <path d="M170 306 L216 304" stroke="#a5b4fc" stroke-width="1.5" marker-end="url(#a)"/>
    <defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><polygon points="0,0 7,3.5 0,7" fill="#a5b4fc"/></marker></defs>
    <text class="cap" x="320" y="412" text-anchor="middle">dependencies point inward — always</text>
  </g>
</svg>
